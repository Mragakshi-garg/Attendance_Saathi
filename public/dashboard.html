<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FaceAttend Admin Dashboard — Overview of attendance stats and activity.">
  <meta name="theme-color" content="#0a0a0f">
  <title>Dashboard — FaceAttend Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="admin-layout">
    <!-- Mobile Hamburger -->
    <button class="hamburger" id="hamburger" aria-label="Toggle sidebar">
      <span></span><span></span><span></span>
    </button>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">F</div>
        <span class="brand-name">FaceAttend</span>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
          </svg>
          Dashboard
        </a>
        <a href="students.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          Students
        </a>
        <a href="attendance.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          Attendance
        </a>

        <div class="nav-separator"></div>

        <a href="#" class="nav-item" id="nav-logout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Logout
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="avatar">A</div>
        <div class="user-info">
          <div class="user-name" id="admin-name">Admin</div>
          <div class="user-role">Administrator</div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="content-header">
        <div>
          <h1>Dashboard</h1>
          <p class="header-date" id="current-date"></p>
        </div>
      </div>

      <!-- Stats Grid -->
      <div class="stats-grid mb-lg">
        <div class="stats-card slide-up" style="animation-delay: 0.05s;">
          <div class="stats-icon violet">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>
          <div class="stats-value" id="stat-total">0</div>
          <div class="stats-label">Total Students</div>
        </div>

        <div class="stats-card slide-up" style="animation-delay: 0.1s;">
          <div class="stats-icon green">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
          </div>
          <div class="stats-value" id="stat-present">0</div>
          <div class="stats-label">Present Today</div>
        </div>

        <div class="stats-card slide-up" style="animation-delay: 0.15s;">
          <div class="stats-icon red">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
          </div>
          <div class="stats-value" id="stat-absent">0</div>
          <div class="stats-label">Absent Today</div>
        </div>

        <div class="stats-card slide-up" style="animation-delay: 0.2s;">
          <div class="stats-icon cyan">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
            </svg>
          </div>
          <div class="stats-value" id="stat-rate">0%</div>
          <div class="stats-label">Attendance Rate</div>
        </div>
      </div>

      <!-- Charts & Activity Row -->
      <div style="display: grid; grid-template-columns: 1.5fr 1fr; gap: var(--space-lg); align-items: start;">
        <!-- Weekly Trend Chart -->
        <div class="glass-card-static slide-up" style="animation-delay: 0.25s;">
          <h2 style="font-size: 18px; font-weight: 600; margin-bottom: var(--space-lg);">Weekly Attendance Trend</h2>
          <div class="chart-container">
            <canvas id="trend-chart"></canvas>
          </div>
        </div>

        <!-- Recent Activity -->
        <div class="glass-card-static slide-up" style="animation-delay: 0.3s;">
          <h2 style="font-size: 18px; font-weight: 600; margin-bottom: var(--space-lg);">Recent Activity</h2>
          <div class="activity-list" id="activity-list">
            <div class="loading-container">
              <div class="loading-spinner"></div>
              <span class="loading-text">Loading activity...</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
