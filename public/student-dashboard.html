<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FaceAttend Student Dashboard — View your attendance, profile, and register your face.">
  <meta name="theme-color" content="#0a0a0f">
  <title>My Dashboard — FaceAttend</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="student-layout">
    <!-- Top Navigation Bar -->
    <header class="student-topbar">
      <a href="index.html" class="brand">
        <div class="brand-icon">F</div>
        <span class="brand-name">FaceAttend</span>
      </a>
      <div class="topbar-actions">
        <div class="user-chip">
          <div class="chip-avatar" id="chip-avatar-letter">S</div>
          <span class="chip-name" id="chip-student-name">Student</span>
        </div>
        <button class="btn btn-ghost btn-sm" id="logout-btn" aria-label="Logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Logout
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="student-content">

      <!-- Profile Header -->
      <section class="profile-header slide-up">
        <div class="profile-avatar-lg" id="profile-avatar">
          <span id="avatar-letter">S</span>
        </div>
        <div class="profile-info">
          <h2 id="profile-name">Loading…</h2>
          <div id="profile-badges" style="display: flex; gap: 8px; margin-bottom: 4px;"></div>
          <div class="profile-meta">
            <span class="meta-item" id="meta-email">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
              </svg>
              <span id="profile-email-text">—</span>
            </span>
            <span class="meta-item" id="meta-roll">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
              </svg>
              <span id="profile-roll-text">—</span>
            </span>
            <span class="meta-item" id="meta-dept">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
              </svg>
              <span id="profile-dept-text">—</span>
            </span>
          </div>
        </div>
      </section>

      <!-- Stats Grid -->
      <div class="stats-grid mb-lg">
        <div class="stats-card slide-up" style="animation-delay: 0.05s;">
          <div class="stats-icon green">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
          </div>
          <div class="stats-value" id="stat-present">0</div>
          <div class="stats-label">Total Present</div>
        </div>

        <div class="stats-card slide-up" style="animation-delay: 0.1s;">
          <div class="stats-icon red">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
          </div>
          <div class="stats-value" id="stat-absent">0</div>
          <div class="stats-label">Total Absent</div>
        </div>

        <div class="stats-card slide-up" style="animation-delay: 0.15s;">
          <div class="stats-icon violet">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
            </svg>
          </div>
          <div class="stats-value" id="stat-rate">0%</div>
          <div class="stats-label">Attendance Rate</div>
          <div class="attendance-ring" id="attendance-ring" style="margin-top: var(--space-md);">
            <svg width="120" height="120" viewBox="0 0 120 120">
              <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="10"/>
              <circle id="ring-progress" cx="60" cy="60" r="52" fill="none" stroke="url(#ringGradient)" stroke-width="10" stroke-linecap="round" stroke-dasharray="326.73" stroke-dashoffset="326.73"/>
              <defs>
                <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#7c3aed"/>
                  <stop offset="100%" stop-color="#06b6d4"/>
                </linearGradient>
              </defs>
            </svg>
            <div class="ring-label">
              <span class="ring-value" id="ring-value">0%</span>
              <span class="ring-text">Rate</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Face Capture Card -->
      <div class="glass-card-static face-capture-card slide-up" id="face-capture-section" style="animation-delay: 0.2s;">
        <h2 style="font-size: 18px; font-weight: 600; margin-bottom: var(--space-md);">Face Profile</h2>
        <div class="capture-preview" id="capture-preview">
          <div class="placeholder-icon" id="face-placeholder">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
        </div>
        <p id="face-status-text" style="color: var(--text-secondary); font-size: 14px; margin-bottom: var(--space-lg);">No face profile registered yet.</p>
        <button class="btn btn-primary" id="capture-face-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>
          </svg>
          Capture Face
        </button>
        <!-- Hidden video for camera -->
        <video id="face-video" autoplay playsinline muted style="display: none;"></video>
        <canvas id="face-canvas-capture" style="display: none;"></canvas>
        <div id="camera-controls-face" style="display: none; margin-top: var(--space-md); gap: var(--space-sm); justify-content: center;">
          <button class="btn btn-primary btn-sm" id="take-photo-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
            Take Photo
          </button>
          <button class="btn btn-ghost btn-sm" id="cancel-camera-btn">Cancel</button>
        </div>
      </div>

      <!-- Attendance History -->
      <div class="glass-card-static slide-up" style="animation-delay: 0.25s; margin-top: var(--space-lg);">
        <h2 style="font-size: 18px; font-weight: 600; margin-bottom: var(--space-lg);">Attendance History</h2>
        <div style="overflow-x: auto;">
          <table class="data-table" id="attendance-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Check-in Time</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="attendance-tbody">
              <tr>
                <td colspan="3" style="text-align: center; color: var(--text-muted); padding: 40px;">
                  <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <span class="loading-text">Loading attendance…</span>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="js/student-dashboard.js"></script>
</body>
</html>
