<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FaceAttend Admin Portal — Secure login for attendance management.">
  <meta name="theme-color" content="#0a0a0f">
  <title>Admin Login — FaceAttend</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="login-page">
    <div class="login-card">
      <!-- Logo -->
      <div class="login-logo">
        <div class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <h1>Admin Portal</h1>
        <p>Sign in to manage attendance</p>
      </div>

      <!-- Login Form -->
      <div class="glass-card-static" style="position: relative;">
        <!-- Loading Overlay -->
        <div id="login-loading" class="login-overlay hidden">
          <div class="loading-spinner lg"></div>
        </div>

        <!-- Error Message -->
        <div id="login-error" class="login-error hidden"></div>

        <form id="login-form" class="login-form" autocomplete="off">
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <div class="input-icon-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <input type="text" id="username" class="form-input" placeholder="Enter your username" required autofocus>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="input-icon-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
              <button type="button" id="toggle-password" class="input-icon-right" aria-label="Toggle password visibility">
                <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" id="login-btn" class="btn btn-primary form-submit">
            Sign In
          </button>
        </form>
      </div>

      <p style="text-align: center; margin-top: var(--space-lg); font-size: 13px; color: var(--text-muted);">
        <a href="index.html" style="color: var(--text-accent);">&larr; Back to Home</a>
      </p>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="js/admin.js"></script>
</body>
</html>
