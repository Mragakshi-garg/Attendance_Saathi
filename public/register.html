<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FaceAttend — Register as a student for face recognition attendance.">
  <meta name="theme-color" content="#0a0a0f">
  <title>Register — FaceAttend</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="login-page">
    <div class="login-card" style="max-width: 520px;">
      <!-- Logo -->
      <div class="login-logo">
        <div class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="8.5" cy="7" r="4"/>
            <line x1="20" y1="8" x2="20" y2="14"/>
            <line x1="23" y1="11" x2="17" y2="11"/>
          </svg>
        </div>
        <h1>Create Account</h1>
        <p>Register to use FaceAttend attendance system</p>
      </div>

      <!-- Registration Form -->
      <div class="glass-card-static" style="position: relative;">
        <!-- Loading Overlay -->
        <div id="register-loading" class="login-overlay hidden">
          <div class="loading-spinner lg"></div>
        </div>

        <!-- Error Message -->
        <div id="register-error" class="login-error hidden"></div>

        <!-- Success Message -->
        <div id="register-success" class="register-success hidden">
          <div class="success-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
          </div>
          <h3>Registration Successful!</h3>
          <p>We've sent a verification code to your email.</p>
          <p style="font-size: 12px; color: var(--text-muted); margin-top: 8px;">Redirecting to verification...</p>
        </div>

        <form id="register-form" autocomplete="off">
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name</label>
            <div class="input-icon-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <input type="text" id="reg-name" class="form-input" placeholder="Enter your full name" required autofocus>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address</label>
            <div class="input-icon-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
              <input type="email" id="reg-email" class="form-input" placeholder="student@example.com" required>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md);">
            <div class="form-group">
              <label class="form-label" for="reg-roll">Roll Number</label>
              <input type="text" id="reg-roll" class="form-input" placeholder="e.g. CS2024001" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="reg-dept">Department</label>
              <select id="reg-dept" class="form-select" required>
                <option value="">Select</option>
                <option value="CS">Computer Science</option>
                <option value="IT">Information Technology</option>
                <option value="ECE">Electronics & Comm.</option>
                <option value="ME">Mechanical Eng.</option>
                <option value="EE">Electrical Eng.</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <div class="input-icon-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input type="password" id="reg-password" class="form-input" placeholder="Min. 6 characters" required minlength="6">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-confirm">Confirm Password</label>
            <div class="input-icon-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input type="password" id="reg-confirm" class="form-input" placeholder="Re-enter your password" required minlength="6">
            </div>
          </div>

          <button type="submit" id="register-btn" class="btn btn-primary form-submit">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="8.5" cy="7" r="4"/>
              <line x1="20" y1="8" x2="20" y2="14"/>
              <line x1="23" y1="11" x2="17" y2="11"/>
            </svg>
            Create Account
          </button>
        </form>
      </div>

      <p style="text-align: center; margin-top: var(--space-lg); font-size: 13px; color: var(--text-muted);">
        Already have an account?
        <a href="admin.html" style="color: var(--text-accent); font-weight: 500;">Sign In</a>
      </p>
      <p style="text-align: center; margin-top: var(--space-sm); font-size: 13px; color: var(--text-muted);">
        <a href="index.html" style="color: var(--text-accent);">&larr; Back to Home</a>
      </p>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="js/register.js"></script>
</body>
</html>
